<style>
:root{--c:#92400e;--bg:#f3ede4;--l:#e4d8c6}*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#2b2118}
header{background:#2b2118;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}

<header><b>لوحة إدارة أهل الأقصر</b><button class="g" id="out" hidden>خروج</button></header>
<main>
<div id="login" class="card"><h3 style="margin-top:0">دخول الإدارة</h3>
<input id="un" placeholder="اسم المستخدم" dir="ltr" autocapitalize="none"><div style="height:8px"></div>
<input id="pw" type="password" placeholder="الرقم السري" dir="ltr"><div style="height:8px"></div>
<button id="go">دخول</button><div id="er" style="color:#b91c1c;margin-top:8px"></div></div>
<div id="dash" hidden>
<div class="tabs" id="tabs"></div><div id="view"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://mvbogyzncrxulagneyvl.supabase.co","sb_publishable_6NG5NuXODNDNHxaN0cuE8A_5ScGBHno");
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const TABS=[['review','المراجعة'],['services','الخدمات'],['stats','إحصائيات'],['reports','البلاغات'],['posts','المنشورات'],['comments','التعليقات'],['users','الأعضاء']];
let tab='review',me=null;
const FLAGS=['سياس','حزب','انتخاب','إخوان','اخوان','حكومة','الحكومه','الرئيس','السيسي','مرسي','مبارك','ثورة','ثوره','مظاهر','إرهاب','ارهاب','معارض','تيار','الجيش','الشرطة','الداخلية','سكس','جنس','قتل','شتيمة','كلب','حمار','ابن ال'];
const REASONS=['محتوى سياسي','محتوى حساس أو غير مناسب','إساءة أو سب لشخص','إعلان مخالف أو مضلل','سبام أو تكرار','غير مفهوم أو ناقص','سبب آخر'];
const flagsOf=t=>FLAGS.filter(k=>(t||'').includes(k));
$('go').onclick=async()=>{
 $('er').textContent='';
 const l=await sb.auth.signInWithPassword({email:$('un').value.trim().toLowerCase()+'@luxor-users.com',password:$('pw').value});
 if(l.error)return $('er').textContent='بيانات الدخول غلط';
 init();
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function init(){
 const {data}=await sb.auth.getSession();if(!data.session)return;
 const p=await sb.from('profiles').select('id,name,is_admin').eq('id',data.session.user.id).maybeSingle();
 if(!p.data||!p.data.is_admin){await sb.auth.signOut();return $('er').textContent='هذا الحساب غير مصرح له بالإدارة'}
 me=p.data;$('login').hidden=true;$('dash').hidden=false;$('out').hidden=false;
 $('tabs').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}</button>`).join('');
 show();
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.t===tab));show()};
async function show(){
 const v=$('view');v.innerHTML='جاري التحميل...';
 if(tab==='review')return review(v);
 if(tab==='services')return services(v);
 if(tab==='stats')return stats(v);
 if(tab==='reports')return reports(v);
 if(tab==='posts')return posts(v);
 if(tab==='comments')return comments(v);
 if(tab==='users')return users(v);
}
function svItem(s,actions){
 return `<div class="it"><b>${esc(s.title)}</b> <small>${esc(s.category)} · ${esc(s.area)} · ${esc(s.profiles?.name||'')} · ${fd(s.created_at)}</small>${s.status!=='pending'?` <small>— ${s.status==='approved'?'✅ منشورة':'❌ مرفوضة'}${s.reject_reason?' ('+esc(s.reject_reason)+')':''}</small>`:''}
 ${s.description?`<div>${esc(s.description)}</div>`:''}
 <div><small>📞 ${esc(s.phone||'-')}${s.whatsapp?' · واتساب: '+esc(s.whatsapp):''}${s.hours?' · 🕒 '+esc(s.hours):''}</small></div>
 ${s.image?`<img src="${esc(s.image)}" style="max-width:100%;max-height:220px;border-radius:8px;margin-top:6px">`:''}
 <div class="row">${actions}</div></div>`;
}
async function services(v){
 const r=await sb.from('services').select('id,title,category,area,description,phone,whatsapp,hours,image,status,reject_reason,created_at,reviewed_at,user_id,profiles!services_user_id_fkey(name,area)').order('created_at',{ascending:false}).limit(200);
 if(r.error)return v.innerHTML=esc(r.error.message);
 const L=r.data||[],pend=L.filter(x=>x.status==='pending'),done=L.filter(x=>x.status!=='pending');
 const tb=[...$('tabs').children].find(x=>x.dataset.t==='services');if(tb)tb.textContent='الخدمات'+(pend.length?` (${pend.length})`:'');
 v.innerHTML=`<div class="card"><b>خدمات في انتظار المراجعة (${pend.length})</b></div>`+(pend.length?pend.map(s=>`<div class="card">${svItem(s,`<button data-a="sap" data-id="${s.id}">✅ نشر</button><select id="srs-${s.id}" style="width:auto">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select><input id="srt-${s.id}" placeholder="تفاصيل (اختياري)" maxlength="150" style="width:auto"><button class="r" data-a="srj" data-id="${s.id}">❌ رفض</button>`)}</div>`).join(''):'<div class="card">مفيش خدمات في الانتظار ✅</div>')
  +`<div class="card"><b>كل الخدمات (${done.length})</b>${done.length?done.map(s=>svItem(s,`<button class="r" data-a="sdv" data-id="${s.id}">حذف</button><button class="g" data-a="sap" data-id="${s.id}">✅ نشر</button>`)).join(''):'<div>لا يوجد</div>'}</div>`;
}
async function stats(v){
 const [pr,po,cm,rp,sv]=await Promise.all([
  sb.from('profiles').select('id,area,created_at,banned').limit(5000),
  sb.from('posts').select('id,category,created_at,user_id,status').limit(5000),
  sb.from('comments').select('id',{count:'exact',head:true}),
  sb.from('reports').select('post_id'),
  sb.from('services').select('status')]);
 const P=pr.data||[],O=po.data||[];
 const day=t=>new Date(t).toISOString().slice(0,10);
 const days=[];for(let i=13;i>=0;i--)days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
 const nu={};P.forEach(x=>{const d=day(x.created_at);nu[d]=(nu[d]||0)+1});
 const np={};O.forEach(x=>{const d=day(x.created_at);np[d]=(np[d]||0)+1});
 const areaOf=Object.fromEntries(P.map(x=>[x.id,x.area]));
 const ac={};O.forEach(x=>{const a=areaOf[x.user_id]||'؟';ac[a]=(ac[a]||0)+1});
 const au={};P.forEach(x=>{au[x.area]=(au[x.area]||0)+1});
 const top=(o,n=8)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n);
 const bars=(arr)=>{const m=Math.max(1,...arr.map(a=>a[1]));return arr.map(([k,n])=>`<div>${esc(k)} <small>(${n})</small><div class="bar"><i style="width:${n/m*100}%"></i></div></div>`).join('')||'<small>لا يوجد</small>'};
 const nrep=new Set((rp.data||[]).map(x=>x.post_id)).size;
 v.innerHTML=`<div class="grid"><div class="st"><b>${P.length}</b>إجمالي الأعضاء</div><div class="st"><b>${O.filter(x=>x.status==='approved').length}</b>المنشورات المنشورة</div><div class="st"><b>${O.filter(x=>x.status==='pending').length}</b>في انتظار المراجعة</div><div class="st"><b>${O.filter(x=>x.status==='rejected').length}</b>مرفوضة</div><div class="st"><b>${cm.count||0}</b>التعليقات</div><div class="st"><b>${nrep}</b>منشورات عليها بلاغات</div><div class="st"><b>${P.filter(x=>x.banned).length}</b>محظورون</div><div class="st"><b>${(sv.data||[]).filter(x=>x.status==='approved').length}</b>خدمات منشورة</div><div class="st"><b>${(sv.data||[]).filter(x=>x.status==='pending').length}</b>خدمات في المراجعة</div></div>
 <div class="card"><b>أعضاء جدد (آخر 14 يوم)</b>${bars(days.map(d=>[d,nu[d]||0]))}</div>
 <div class="card"><b>منشورات جديدة (آخر 14 يوم)</b>${bars(days.map(d=>[d,np[d]||0]))}</div>
 <div class="card"><b>أكثر المناطق نشاطاً (منشورات)</b>${bars(top(ac))}</div>
 <div class="card"><b>أكثر المناطق أعضاءً</b>${bars(top(au))}</div>`;
}
async function review(v){
 const r=await sb.from('posts').select('id,body,image,video,category,created_at,user_id,profiles!posts_user_id_fkey(name,area)').eq('status','pending').order('created_at',{ascending:true}).limit(50);
 if(r.error)return v.innerHTML=esc(r.error.message);
 const L=r.data||[];
 const tb=[...$('tabs').children].find(x=>x.dataset.t==='review');if(tb)tb.textContent='المراجعة'+(L.length?` (${L.length})`:'');
 v.innerHTML=L.length?L.map(p=>{const f=flagsOf(p.body);return `<div class="card it" style="${f.length?'border:2px solid #f59e0b':''}"><b>${esc(p.profiles?.name)}</b> <small>${esc(p.profiles?.area)} · ${esc(p.category)} · ${fd(p.created_at)}</small>${f.length?`<div style="background:#fef3c7;color:#92400e;border-radius:6px;padding:4px 8px;margin:6px 0;font-size:13px">⚠️ كلمات محتاجة انتباه: ${f.map(esc).join('، ')} (تنبيه آلي بس، القرار ليك)</div>`:''}<p style="white-space:pre-wrap">${esc(p.body)}</p>${p.image?`<img src="${p.image}" style="max-width:100%;border-radius:8px">`:''}${p.video?`<video src="${esc(p.video)}" controls playsinline preload="metadata" style="width:100%;max-height:50vh;background:#000;border-radius:8px"></video>`:''}
 <div class="row"><button class="g" data-a="ap" data-id="${p.id}">✅ نشر</button></div>
 <div class="row"><select id="rs-${p.id}">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select><input id="rt-${p.id}" placeholder="تفاصيل إضافية (اختياري)" maxlength="150"><button class="r" data-a="rj" data-id="${p.id}">❌ رفض</button></div></div>`}).join(''):'<div class="card">مفيش منشورات في انتظار المراجعة ✅</div>';
}
async function reports(v){
 const r=await sb.from('reports').select('post_id,created_at,reason,posts(id,body,user_id,profiles!posts_user_id_fkey(name))').order('created_at',{ascending:false});
 if(r.error)return v.innerHTML=esc(r.error.message);
 const g={};(r.data||[]).forEach(x=>{if(x.posts){const e=(g[x.post_id]=g[x.post_id]||{p:x.posts,n:0,rs:{}});e.n++;if(x.reason)e.rs[x.reason]=(e.rs[x.reason]||0)+1}});
 const ids=Object.keys(g);
 v.innerHTML='<div class="card">'+(ids.length?ids.map(id=>`<div class="it"><b>${esc(g[id].p.profiles?.name)}</b> <small>(${g[id].n} بلاغ)</small>${Object.keys(g[id].rs).length?`<br><small>الأسباب: ${Object.entries(g[id].rs).map(([k,n])=>esc(k)+' ('+n+')').join('، ')}</small>`:''}<br>${esc((g[id].p.body||'[صورة]').slice(0,300))}<div class="row"><button class="r" data-a="dp" data-id="${id}">حذف المنشور</button><button class="g" data-a="ir" data-id="${id}">تجاهل البلاغ</button><button class="r" data-a="ban" data-id="${g[id].p.user_id}">حظر صاحبه</button></div></div>`).join(''):'مفيش بلاغات')+'</div>';
 const cr=await sb.from('comment_reports').select('comment_id,reason,comments(id,body,user_id,profiles!comments_user_id_fkey(name))');
 const cg={};(cr.data||[]).forEach(x=>{if(x.comments){const e=(cg[x.comment_id]=cg[x.comment_id]||{c:x.comments,n:0,rs:[]});e.n++;if(x.reason)e.rs.push(x.reason)}});
 const cids=Object.keys(cg);
 v.innerHTML+='<div class="card"><b>بلاغات التعليقات</b>'+(cids.length?cids.map(id=>`<div class="it"><b>${esc(cg[id].c.profiles?.name)}</b> <small>(${cg[id].n} بلاغ: ${cg[id].rs.map(esc).join('، ')})</small><br>${esc(cg[id].c.body)}<div class="row"><button class="r" data-a="dc" data-id="${id}">حذف التعليق</button><button class="g" data-a="icr" data-id="${id}">تجاهل</button><button class="r" data-a="ban" data-id="${cg[id].c.user_id}">حظر صاحبه</button></div></div>`).join(''):'<div>مفيش</div>')+'</div>';
}
async function posts(v){
 const r=await sb.from('posts').select('id,body,image,video,status,category,created_at,user_id,profiles!posts_user_id_fkey(name,area)').order('created_at',{ascending:false}).limit(100);
 v.innerHTML='<div class="card">'+(r.data||[]).map(p=>`<div class="it"><b>${esc(p.profiles?.name)}</b> <small>${esc(p.profiles?.area)} · ${esc(p.category)} · ${fd(p.created_at)}</small><br>${esc((p.body||'').slice(0,300))}${p.image?' <small>[صورة]</small>':''}${p.video?' <small>[فيديو]</small>':''} <small><b>${{approved:'✅ منشور',pending:'⏳ قيد المراجعة',rejected:'❌ مرفوض'}[p.status]||''}</b></small><div class="row"><button class="r" data-a="dp" data-id="${p.id}">حذف</button><button class="r" data-a="ban" data-id="${p.user_id}">حظر صاحبه</button></div></div>`).join('')+'</div>';
}
async function comments(v){
 const r=await sb.from('comments').select('id,body,created_at,user_id,profiles!comments_user_id_fkey(name)').order('created_at',{ascending:false}).limit(100);
 v.innerHTML='<div class="card">'+((r.data||[]).map(c=>`<div class="it"><b>${esc(c.profiles?.name)}</b> <small>${fd(c.created_at)}</small><br>${esc(c.body)}<div class="row"><button class="r" data-a="dc" data-id="${c.id}">حذف</button><button class="r" data-a="ban" data-id="${c.user_id}">حظر صاحبه</button></div></div>`).join('')||'لا يوجد')+'</div>';
}
let UQ='';
async function users(v){
 const r=await sb.from('profiles').select('id,username,name,area,banned,is_admin,created_at').order('created_at',{ascending:false}).limit(300);
 const list=(r.data||[]).filter(u=>!UQ||(u.name+u.username).toLowerCase().includes(UQ.toLowerCase()));
 v.innerHTML=`<div class="card"><input id="uq" placeholder="بحث بالاسم أو اليوزر" value="${esc(UQ)}">${list.map(u=>`<div class="it"><b>${esc(u.name)}</b> <small>@${esc(u.username)} · ${esc(u.area)} · ${fd(u.created_at)}</small>${u.banned?' <b style="color:#b91c1c">[محظور]</b>':''}${u.is_admin?' <b>[أدمن]</b>':''}${u.is_admin?'':`<div class="row">${u.banned?`<button class="g" data-a="unban" data-id="${u.id}">إلغاء الحظر</button>`:`<button class="r" data-a="ban" data-id="${u.id}">حظر</button>`}<button class="r" data-a="du" data-id="${u.id}">حذف العضو وكل محتواه</button></div>`}</div>`).join('')}</div>`;
 $('uq').oninput=e=>{UQ=e.target.value;users(v)};
}
$('view').onclick=async e=>{
 const b=e.target.closest('button');if(!b||!b.dataset.a)return;const id=b.dataset.id;let r;
 switch(b.dataset.a){
  case 'sap':r=await sb.rpc('admin_review_service',{sid:id,st:'approved',reason:null});break;
  case 'srj':{const a=$('srs-'+id).value,x=$('srt-'+id).value.trim();r=await sb.rpc('admin_review_service',{sid:id,st:'rejected',reason:a+(x?' - '+x:'')});break}
  case 'sdv':if(!confirm('حذف الخدمة؟'))return;r=await sb.from('services').delete().eq('id',id);break;
  case 'ap':r=await sb.rpc('admin_review_post',{pid:id,st:'approved',reason:null});break;
  case 'rj':{const a=$('rs-'+id).value,x=$('rt-'+id).value.trim();r=await sb.rpc('admin_review_post',{pid:id,st:'rejected',reason:a+(x?' - '+x:'')});break}
  case 'dp':if(!confirm('حذف المنشور؟'))return;r=await sb.from('posts').delete().eq('id',id);break;
  case 'dc':if(!confirm('حذف التعليق؟'))return;r=await sb.from('comments').delete().eq('id',id);break;
  case 'icr':r=await sb.from('comment_reports').delete().eq('comment_id',id);break;
  case 'ir':r=await sb.from('reports').delete().eq('post_id',id);break;
  case 'ban':if(!confirm('حظر العضو؟ مش هيقدر ينشر أو يعلّق.'))return;r=await sb.rpc('admin_set_ban',{uid:id,flag:true});break;
  case 'unban':r=await sb.rpc('admin_set_ban',{uid:id,flag:false});break;
  case 'du':if(!confirm('حذف العضو نهائياً مع كل منشوراته وتعليقاته؟ لا يمكن التراجع.'))return;r=await sb.rpc('admin_delete_user',{uid:id});break;
 }
 if(r&&r.error)alert('خطأ: '+r.error.message);
 show();
};
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
