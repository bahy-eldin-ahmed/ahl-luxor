<script>
const sb=supabase.createClient("https://mvbogyzncrxulagneyvl.supabase.co","sb_publishable_6NG5NuXODNDNHxaN0cuE8A_5ScGBHno");
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SCATS=[['سباكة','🚰'],['كهرباء','💡'],['نجارة','🪚'],['نقل ومشاوير','🚚'],['صيانة أجهزة','🔧'],['تكييف وتبريد','❄️'],['محارة ومقاولات','🧱'],['دهانات وديكور','🎨'],['حدادة وألوميتال','🔩'],['سيارات وميكانيكا','🚗'],['طب وتمريض','🩺'],['صيدلية','💊'],['دروس خصوصية','📚'],['حلويات وأكل بيت','🍰'],['خياطة وتطريز','🧵'],['كوافير وتجميل','💇'],['محاماة ومحاسبة','⚖️'],['كمبيوتر وموبايل','💻'],['تنظيف','🧹'],['أخرى','✨']];
const SICON=Object.fromEntries(SCATS);
const AREA_GROUPS={"مدينة الأقصر": ["مدينة الأقصر", "الكرنك", "العوامية", "منشأة العماري", "البر الغربي"], "البياضية": ["البياضية", "البغدادي", "الحبيل", "الروافعة الغربية"], "الطود": ["الطود", "العديسات (العدايسة)", "منشية النوبة"], "طيبة والزينية": ["طيبة الجديدة", "الزينية", "الصعايدة", "العشي", "المدامود"], "القرنة": ["القرنة", "البعيرات", "الأقالتة", "الشيخ عامر", "الضبعية", "قامولا", "المريس", "الملاحية"], "أرمنت": ["أرمنت", "الدمقراط", "الرزيقات", "الريانية", "المحاميد"], "إسنا": ["إسنا", "أصفون", "الحلة", "الحميدات", "الدبابية", "الدير", "الشغب", "العضايمة", "الغريرة", "القرايا", "الكلابية", "المساوية", "المعلة", "النجوع", "النمسا", "الهنادي", "الوسطى", "جزيرة راجح", "زرنيخ", "طفنيس", "كومير", "كيمان المطاعنة", "وبورات المطاعنة"], "غير ذلك": ["أخرى"]};
const AREAS=Object.values(AREA_GROUPS).flat();
const waNum=p=>{let d=String(p||'').replace(/[^0-9]/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='20'+d.slice(1);return d};
let all=[],cat='',area='';
Object.entries(AREA_GROUPS).forEach(([g,l])=>{const og=document.createElement('optgroup');og.label=g;l.forEach(a=>og.appendChild(new Option(a,a)));$('ar').appendChild(og)});
$('cats').innerHTML=['الكل',...SCATS.map(c=>c[0])].map(c=>`<button class="chip ${c==='الكل'?'on':''}" data-c="${c==='الكل'?'':c}">${c==='الكل'?'الكل':(SICON[c]||'')+' '+c}</button>`).join('');
$('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[...$('cats').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('q').oninput=render;$('ar').onchange=()=>{area=$('ar').value;render()};
function render(){
 const q=$('q').value.trim();
 const L=all.filter(s=>(!cat||s.category===cat)&&(!area||s.area===area)&&(!q||((s.title||'')+(s.description||'')+(s.category||'')+(s.area||'')+((s.profiles&&s.profiles.name)||'')).includes(q)));
 $('list').innerHTML=L.length?L.map(s=>{
  const wa=s.whatsapp||s.phone||'';
  return `<article class="sv"><h2>${esc(s.title)}</h2><div><span class="tag">${esc((SICON[s.category]||'')+' '+s.category)}</span></div>
  <div class="meta">📍 ${esc(s.area)}${s.profiles?.name?' · '+esc(s.profiles.name):''}${s.hours?' · 🕒 '+esc(s.hours):''}</div>
  ${s.description?`<div class="desc">${esc(s.description)}</div>`:''}${s.image?`<img src="${esc(s.image)}" alt="${esc(s.title)} في ${esc(s.area)}" loading="lazy">`:''}
  <div class="acts">${s.phone?`<a class="tel" href="tel:${esc(s.phone)}">📞 اتصل</a>`:''}${wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(wa)}?text=${encodeURIComponent('السلام عليكم، وصلت لخدمتك «'+s.title+'» من دليل خدمات أهل الأقصر')}">💬 واتساب</a>`:''}</div></article>`;
 }).join(''):`<div class="empty">مفيش خدمات مطابقة للبحث ده لسه.<br>عندك خدمة؟ <a href="index.html">ضيفها مجانًا</a>.</div>`;
}
(async()=>{
 const r=await sb.from('services').select('id,title,category,area,description,phone,whatsapp,hours,image,created_at,profiles!services_user_id_fkey(name)').eq('status','approved').order('created_at',{ascending:false}).limit(300);
 if(r.error){$('list').innerHTML='<div class="empty">تعذر تحميل الخدمات دلوقتي.</div>';return}
 all=r.data||[];render();
 if(all.length){
  const ld={"@context":"https://schema.org","@type":"ItemList","name":"دليل خدمات الأقصر","itemListElement":all.slice(0,40).map((s,i)=>({"@type":"ListItem",position:i+1,item:{"@type":"Service",name:s.title,serviceType:s.category,areaServed:s.area,description:(s.description||'').slice(0,200),telephone:s.phone||undefined,provider:{"@type":"Person",name:s.profiles?.name||'عضو من أهل الأقصر'}}}))};
  const el=document.createElement('script');el.type='application/ld+json';el.textContent=JSON.stringify(ld);document.head.appendChild(el);
 }
})();
</script>
