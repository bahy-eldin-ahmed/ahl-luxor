:root{--c:#b45309;--c2:#92400e;--bg:#f5efe6;--card:#fff;--t:#2b2118;--m:#7a6a5a;--l:#e8dccb}
*{box-sizing:border-box}
html,body{overflow-x:hidden}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between}

main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.note{background:#fff7e0;border:1px solid #f0d58a;font-size:13px;line-height:1.7}
textarea,input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--t)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}

.av{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.ph{display:flex;gap:10px;align-items:center}
.ph small{color:var(--m);display:block}
.post p{white-space:pre-wrap;line-height:1.8;margin:10px 0}
.post img{max-width:100%;border-radius:8px}
.acts{display:flex;gap:4px;border-top:1px solid var(--l);margin-top:8px;padding-top:4px}
.cm{background:#faf5ec;border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px}

.filters{display:flex;gap:8px;align-items:center}
#modal{position:fixed;inset:60px 12px auto 12px;max-width:600px;margin:auto;max-height:70vh;overflow:auto;z-index:9;box-shadow:0 4px 20px #0004}
.empty{text-align:center;color:var(--m);padding:30px}
body.dark{--bg:#17130f;--card:#241e18;--t:#f0e8dc;--m:#a8998a;--l:#3a3128}
body.dark textarea,body.dark input,body.dark select{background:#1b1612;color:var(--t);border-color:var(--l)}
body.dark .cm{background:#2d261f}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--l);background:var(--card);color:var(--t);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}

#bnav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--l);display:flex;justify-content:space-around;z-index:6;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
#bnav button{background:none;border:0;font:inherit;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative;padding:2px 8px}
#bnav button span{font-size:21px}
#bnav button.on{color:var(--c);font-weight:bold}
#bnav .badge{position:absolute;top:-2px;inset-inline-start:2px}
body{padding-bottom:62px}

.reelbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-weight:bold}

.up{font-size:12px;color:var(--m);margin-top:6px}

 #chips{display:none}
 #bnav{display:none}body{padding-bottom:0}

 m.innerHTML=`<b>تعديل المنشور</b> <button class="ghost" id="cl">إغلاق</button><div class="row"><textarea id="ebody" maxlength="1500"></textarea></div><div class="row"><select id="ecat">${CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select><button class="btn" id="esv" data-id="${id}">حفظ</button></div>${p.status==='approved'?'<div class="up">بعد التعديل المنشور هيرجع للمراجعة ومش هيظهر للناس لحد ما الإدارة توافق.</div>':''}`;
 $('ebody').value=p.body||'';
}
document.addEventListener('click',e=>{if(!e.target.closest('.mn'))document.querySelectorAll('.mm').forEach(x=>x.hidden=true)});
$('modal').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.rs&&pcb){const f=pcb;pcb=null;return f(REASONS[+b.dataset.rs])}
 if(b.id==='svw'){view='saved';cf='';$('modal').hidden=true;menu();chips();render();window.scrollTo(0,0);return}
 if(b.id==='ps')return privacy();
 if(b.dataset.ub){await sb.from('user_blocks').delete().match({user_id:me.id,target_id:b.dataset.ub});blk.delete(b.dataset.ub);render();return privacy()}
 if(b.id==='clh'){await sb.from('hidden_posts').delete().eq('user_id',me.id);hid.clear();render();return privacy()}
 if(b.id==='esv'){const t=$('ebody').value.trim();if(!t&&!posts.find(x=>x.id===b.dataset.id)?.image&&!posts.find(x=>x.id===b.dataset.id)?.video)return alert('اكتب نص');const r=await sb.from('posts').update({body:t,category:$('ecat').value}).eq('id',b.dataset.id);if(r.error)return alert('تعذر الحفظ: '+r.error.message);$('modal').hidden=true;alert('اتحفظ التعديل واتبعت للمراجعة.');load();return}
 if(b.id==='cl'){$('modal').hidden=true;return}
 if(!b.dataset.xd&&!b.dataset.xi)return;
 if(b.dataset.xd){await sb.from('posts').delete().eq('id',b.dataset.xd)}
 if(b.dataset.xi){await sb.from('reports').delete().eq('post_id',b.dataset.xi)}
 $('adm').onclick();load();
};
async function showProfile(id){
 const m=$('modal');m.hidden=false;m.innerHTML='...';
 const [p,c]=await Promise.all([sb.from('profiles').select('name,area,bio,created_at,username').eq('id',id).maybeSingle(),sb.from('posts').select('id',{count:'exact',head:true}).eq('user_id',id)]);
 if(!p.data){m.innerHTML='غير موجود';return}
 const x=p.data,mine=id===me.id;
 m.innerHTML=`<div class="ph"><div class="av">${esc(x.name[0])}</div><div><b>${esc(x.name)}</b><small>${esc(x.area)} · @${esc(x.username)}</small></div></div><p>${esc(x.bio||(mine?'أضف نبذة عنك':'مفيش نبذة'))}</p><small>${c.count||0} منشور · عضو من ${new Date(x.created_at).toLocaleDateString('ar-EG')}</small>${mine?'<div class="row"><input id="bio" maxlength="200" placeholder="نبذة عنك (200 حرف)" value="'+esc(x.bio||'')+'"><button class="btn" id="sbio">حفظ</button></div>':''}<div class="row"><button class="ghost" id="cl">إغلاق</button>${mine?'<button class="ghost" id="svw">🔖 المحفوظات</button><button class="ghost" id="ps">⚙️ الخصوصية والحظر</button><button class="ghost" id="lo">تسجيل خروج</button>':''}</div>`;
 if(mine)$('lo').onclick=async()=>{await sb.auth.signOut();$('modal').hidden=true;init()};
 if(mine)$('sbio').onclick=async()=>{const r=await sb.from('profiles').update({bio:$('bio').value.trim()}).eq('id',me.id);if(r.error)alert('خطأ: '+r.error.message);else showProfile(id)};
}
$('me').onclick=()=>showProfile(me.id);
$('nt').onclick=async()=>{
 const since=localStorage.seen||'1970-01-01T00:00:00Z';
 const [r,pp]=await Promise.all([
  sb.from('comments').select('body,created_at,post_id,profiles!comments_user_id_fkey(name),posts!inner(user_id,body)').eq('posts.user_id',me.id).neq('user_id',me.id).order('created_at',{ascending:false}).limit(15),
  sb.from('posts').select('id,body,status,reject_reason,created_at,reviewed_at').eq('user_id',me.id).in('status',['approved','rejected']).not('reviewed_at','is',null).order('reviewed_at',{ascending:false}).limit(15)]);
 const rv=(pp.data||[]).filter(p=>p.status==='rejected'||new Date(p.reviewed_at)-new Date(p.created_at)>5000).map(p=>({t:p.reviewed_at,h:p.status==='rejected'?`❌ منشورك «${esc((p.body||'').slice(0,30))}» اترفض. السبب: ${esc(p.reject_reason||'غير محدد')}`:`✅ منشورك «${esc((p.body||'').slice(0,30))}» اتنشر`}));
 const cm=(r.data||[]).map(c=>({t:c.created_at,h:`<b>${esc(c.profiles?.name)}</b> علّق على منشورك «${esc((c.posts.body||'').slice(0,30))}»: ${esc(c.body)}`}));
 const all=[...rv,...cm].sort((a,b)=>a.t<b.t?1:-1);
 const m=$('modal');m.hidden=false;
 m.innerHTML='<b>إشعارات</b> <button class="ghost" id="cl">إغلاق</button>'+(all.length?all.map(c=>`<div class="cm">${c.h}${c.t>since?' <span class="badge">جديد</span>':''}<br><small>${ago(c.t)}</small></div>`).join(''):'<div class="empty">مفيش إشعارات</div>');
 localStorage.seen=new Date().toISOString();$('nt').textContent='🔔';
};
async function notif(){if(!prof)return;const since=localStorage.seen||'1970-01-01T00:00:00Z';
 const [r,pp]=await Promise.all([sb.from('comments').select('id,posts!inner(user_id)',{count:'exact',head:true}).eq('posts.user_id',me.id).neq('user_id',me.id).gt('created_at',since),
  sb.from('posts').select('status,created_at,reviewed_at').eq('user_id',me.id).gt('reviewed_at',since)]);
 const n=(r.count||0)+(pp.data||[]).filter(p=>p.status==='rejected'||new Date(p.reviewed_at)-new Date(p.created_at)>5000).length;
 $('nt').hidden=false;$('nt').innerHTML='🔔'+(n?`<span class="badge">${n}</span>`:'')}
setInterval(()=>{if(prof&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA')load()},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script>
